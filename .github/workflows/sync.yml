name: Sync formulas

on:
  schedule:
    - cron: "35 */4 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [app-release]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Homebrew formulas from latest releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/sync-formulas.sh
          ./scripts/sync-formulas.sh

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.rb
          if git diff --staged --quiet; then
            echo "No formula changes"
            exit 0
          fi
          git commit -m "chore: sync homebrew formulas from latest releases"
          git push
